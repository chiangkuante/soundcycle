<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Headphones whose headband is a cycle arrow: sound moves from the
       dimmed left ear cup over the top to the glowing right one. -->
  <defs>
    <linearGradient id="band" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="0.5" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.45" stop-color="#22B4F0"/>
      <stop offset="1" stop-color="#2156E8"/>
    </linearGradient>
    <linearGradient id="activePad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3FAF"/>
      <stop offset="1" stop-color="#172E80"/>
    </linearGradient>
    <linearGradient id="idle" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C6BF0"/>
    </linearGradient>
    <linearGradient id="idlePad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4BC4"/>
      <stop offset="1" stop-color="#46389E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shifted up so the artwork (y 65–228) is centred vertically. -->
  <g transform="translate(0 -18)">

  <!-- Glow behind the active ear cup -->
  <circle cx="205" cy="187" r="56" fill="url(#glow)"/>

  <!-- Headband: semicircle centred over both cups (centre 128,150, r 76),
       stopping at 28° where the arrowhead takes over. -->
  <path d="M 52 152 A 76 76 0 0 1 195.1 114.3" fill="none" stroke="url(#band)" stroke-width="18" stroke-linecap="round"/>
  <!-- Arrowhead along the arc's tangent at 25°, tip just above the right cup -->
  <path d="M 216.9 108.7 L 176.9 127.1 L 207 140 Z" fill="#22D3EE" stroke="#22D3EE" stroke-width="7" stroke-linejoin="round"/>

  <!-- Left ear cup (the device left behind): shell + inward cushion -->
  <g opacity="0.75">
    <rect x="66" y="156" width="20" height="62" rx="10" fill="url(#idlePad)"/>
    <rect x="24" y="146" width="52" height="82" rx="24" fill="url(#idle)"/>
  </g>

  <!-- Right ear cup (the device switched to): shell + inward cushion + shine -->
  <rect x="170" y="156" width="20" height="62" rx="10" fill="url(#activePad)"/>
  <rect x="180" y="146" width="52" height="82" rx="24" fill="url(#active)"/>
  <rect x="190" y="154" width="18" height="34" rx="9" fill="url(#shine)"/>
  </g>
</svg>
