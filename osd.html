<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>SoundCycle OSD</title>
    <style>
      :root {
        --card: rgb(32 32 32 / 0.94);
        --text: #ffffff;
        --muted: #b5b5b5;
        --accent: #4cc2ff;
        --error: #ff99a4;
        --border: rgb(255 255 255 / 0.08);
        --shadow: 0 2px 6px rgb(0 0 0 / 0.16), 0 10px 28px rgb(0 0 0 / 0.22);
        font-family: "Segoe UI Variable", "Segoe UI", "Microsoft JhengHei UI", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --card: rgb(249 249 249 / 0.96);
          --text: #1b1b1b;
          --muted: #5d5d5d;
          --accent: #0067c0;
          --error: #c42b1c;
          --border: rgb(0 0 0 / 0.08);
          --shadow: 0 1px 4px rgb(0 0 0 / 0.06), 0 8px 24px rgb(0 0 0 / 0.1);
        }
      }

      /* The window is transparent and click-through; only the card shows. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        /* Room for the card's shadow so the window edge doesn't clip it. */
        padding: 32px;
        box-sizing: border-box;
      }

      #card {
        max-width: 100%;
        min-width: 220px;
        padding: 12px 18px;
        display: grid;
        gap: 8px;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 150ms ease-out,
          transform 150ms ease-out;
      }

      #card.visible {
        opacity: 1;
        transform: none;
      }

      #card.hiding {
        transition-duration: 200ms;
      }

      #card.pop {
        animation: pop 180ms ease-out;
      }

      @keyframes pop {
        from {
          transform: scale(0.96);
        }
      }

      .switched {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .switched svg {
        flex: none;
        width: 22px;
        height: 22px;
        fill: var(--accent);
      }

      .names {
        display: grid;
        min-width: 0;
      }

      .device {
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hardware {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .error {
        font-size: 12px;
        color: var(--error);
      }
    </style>
    <script type="module" src="/src/osd.ts" defer></script>
  </head>

  <body>
    <div id="card"></div>
  </body>
</html>
